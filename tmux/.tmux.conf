# ============================================
#          Tmux Configuration File
# ============================================

# --------------------------------------------
#           Quick Reload Binding
# --------------------------------------------
# Press prefix + r to reload configuration instantly
unbind r
bind r source-file ~/.tmux.conf \; display-message "Configuration reloaded!"

# --------------------------------------------
#           General Settings
# --------------------------------------------
# Enable mouse support for scrolling and selection
set -g mouse on

# Position the status bar at the top of the terminal
set-option -g status-position top

set -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# --------------------------------------------
#           Pane Navigation
# --------------------------------------------
# Vim-style pane navigation (prefix + h/j/k/l)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# --------------------------------------------
#           Plugin Manager (TPM)
# --------------------------------------------
# List of plugins
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'tmux-plugins/tpm'

# --------------------------------------------
#           Rose-Pine Theme Configuration
# --------------------------------------------
# Theme variant: 'main', 'moon', or 'dawn'
set -g @rose_pine_variant 'main'

# Status bar components
set -g @rose_pine_host 'on'          # Show hostname in status bar
set -g @rose_pine_user 'on'          # Show username in status bar
set -g @rose_pine_directory 'on'     # Show current directory in status bar
set -g @rose_pine_show_current_program 'on'  # Show running program as window name

# Date and time format (accepts UNIX date command format)
set -g @rose_pine_date_time ''

# Transparent background support
set -g @rose_pine_bar_bg_disable 'on'
set -g @rose_pine_bar_bg_disabled_color_option 'default'

# --------------------------------------------
#           TPM Initialization
# --------------------------------------------
# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
