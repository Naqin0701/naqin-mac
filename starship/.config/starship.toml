"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true

format = """
$directory $git_branch $git_status$python$rust$golang$lua$nodejs$conda
$character"""

[character]
success_symbol = "[❯](bold #7ac4cc)"
error_symbol = "[❯](bold #ff3030)"

[directory]
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
format = "[$path]($style)"
style = "#7ac4cc"
home_symbol = "~"

[directory.substitutions]
Documents = "󰈙"
Downloads = " "
Music = " "
Pictures = " "

[git_branch]
symbol = "  "
format = "[$symbol$branch](bold #ccac00)"

[git_status]
format = "[($all_status$ahead_behind)]($style)"
style = "#559a70"
up_to_date = '[ ✓ ](bg:overlay fg:iris)'
untracked = '[?\($count\)](bg:overlay fg:gold)'
stashed = '[\$](bg:overlay fg:iris)'
modified = '[!\($count\)](bg:overlay fg:gold)'
renamed = '[»\($count\)](bg:overlay fg:iris)'
deleted = '[✘\($count\)](style)'
staged = '[++\($count\)](bg:overlay fg:gold)'
ahead = '[⇡\(${count}\)](bg:overlay fg:foam)'
diverged = '⇕[\[](bg:overlay fg:iris)[⇡\(${ahead_count}\)](bg:overlay fg:foam)[⇣\(${behind_count}\)](bg:overlay fg:rose)[\]](bg:overlay fg:iris)'
behind = '[⇣\(${count}\)](bg:overlay fg:rose)'

[python]
symbol = " 󰌠 "
format = "[$symbol$version](bold #0099cc)"
detect_files = ["pyproject.toml", "setup.py", "__init__.py", ".python-version"]
version_format = "v${raw}"

[rust]
symbol = " 󱘗 "
format = "[$symbol$version](bold #ccac00)"
version_format = "v${raw}"

[golang]
symbol = " 󰟓 "
format = "[$symbol$version](bold #7ac4cc)"
version_format = "v${raw}"

[lua]
symbol = " 󰢱 "
format = "[$symbol$version](bold #559a70)"
detect_files = ["*.lua", ".lua-version"]
version_format = "v${raw}"

[nodejs]
symbol = " 󰌞 "
format = "[$symbol$version](bold #ccac00)"
detect_files = ["package.json", ".nvmrc", "node_modules"]
version_format = "v${raw}"

[conda]
symbol = "  "
format = "[$symbol$environment](bold #559a70)"
ignore_base = true

